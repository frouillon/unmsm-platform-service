services:
  mysql:
    image: mysql:8.4
    container_name: unmsm-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: bd_servicios_unmsm
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  backend:
    build:
      context: ./backend
    container_name: unmsm-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/bd_servicios_unmsm?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://127.0.0.1,http://127.0.0.1:80}
      JWT_SECRET: ${JWT_SECRET:-FAtZEQgt9DoTfroMggQgC4TeYLGSK/HL6cJflW+WBaQNpOpaC2DML5X7qvFe6amE}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-480}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Lima}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8080}
      EVIDENCIAS_DIR: /data/evidencias
      SEED_ENABLED: ${SEED_ENABLED:-true}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-SanMarcos2026}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - evidencias_data:/data/evidencias

  frontend:
    build:
      context: ./frontend
    container_name: unmsm-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"

volumes:
  mysql_data:
  evidencias_data:
