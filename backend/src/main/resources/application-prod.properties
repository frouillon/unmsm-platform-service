# Perfil de producción / cloud.
# Actívalo con: SPRING_PROFILES_ACTIVE=prod
# Sin defaults inseguros: si falta una variable obligatoria, la app no arranca.

spring.datasource.password=${DB_PASSWORD}
app.jwt.secret=${JWT_SECRET}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.public-url=${APP_PUBLIC_URL}

# En prod el seed de usuarios demo va apagado por defecto.
app.seed.enabled=${SEED_ENABLED:false}
app.seed.demo-password=${DEMO_PASSWORD:unused}

# Logs en JSON (formato ECS) para que la plataforma cloud los indexe; incluyen correlationId y traceId.
logging.structured.format.console=${LOG_FORMAT:ecs}
management.tracing.sampling.probability=${TRACING_SAMPLING:0.2}
