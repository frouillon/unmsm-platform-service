# Perfil de producción / cloud.
# Actívalo con: SPRING_PROFILES_ACTIVE=prod
# Sin defaults inseguros: si falta una variable obligatoria, la app no arranca.

spring.datasource.password=${DB_PASSWORD}
app.jwt.secret=${JWT_SECRET}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.public-url=${APP_PUBLIC_URL}

# En prod el seed de usuarios demo va apagado por defecto.
app.seed.enabled=${SEED_ENABLED:false}
app.seed.demo-password=${DEMO_PASSWORD:unused}
