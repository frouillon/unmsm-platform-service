spring.application.name=platform
# Railway inyecta PORT; en local queda 8080.
server.port=${PORT:8080}

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:mysql://localhost:3306/bd_servicios_unmsm?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
# Defaults solo para desarrollo local. En cloud usa el perfil "prod" (application-prod.properties).
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
# Valor solo para desarrollo. En prod define JWT_SECRET (Base64, mínimo 256 bits).
app.jwt.secret=${JWT_SECRET:FAtZEQgt9DoTfroMggQgC4TeYLGSK/HL6cJflW+WBaQNpOpaC2DML5X7qvFe6amE}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}

app.zona-horaria=${APP_TIMEZONE:America/Lima}
app.storage.evidencias-dir=${EVIDENCIAS_DIR:uploads/evidencias}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=26MB
app.seed.enabled=${SEED_ENABLED:true}
app.seed.demo-password=${DEMO_PASSWORD:SanMarcos2026}

# Documentación OpenAPI / Swagger UI
app.public-url=${APP_PUBLIC_URL:http://localhost:8080}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.try-it-out-enabled=true

# --- Alertas de SLA y consolidado diario (HU-21) --------------------------------
app.sla.alertas.habilitado=${SLA_ALERTAS_HABILITADO:true}
# Cada 15 minutos revisa solicitudes abiertas por vencer o vencidas.
app.sla.alertas.cron=${SLA_ALERTAS_CRON:0 */15 * * * *}
# Una solicitud está "en riesgo" si le quedan menos de estas horas para vencer.
app.sla.alertas.umbral-horas=${SLA_UMBRAL_HORAS:24}
# Consolidado matutino para supervisores (lunes a viernes, 8:00 hora de Lima).
app.sla.consolidado.cron=${SLA_CONSOLIDADO_CRON:0 0 8 * * MON-FRI}
