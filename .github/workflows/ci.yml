name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (pruebas)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Las pruebas de integración usan MySQL real, así que levantamos uno temporal.
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Dar permiso de ejecución al wrapper de Maven
        run: chmod +x mvnw

      - name: Correr pruebas
        run: ./mvnw -B test
        env:
          DB_PASSWORD: root

      - name: Resumen de cobertura
        if: always()
        run: |
          CSV=target/site/jacoco/jacoco.csv
          if [ -f "$CSV" ]; then
            awk -F, 'NR>1 {lm+=$8; lc+=$9; bm+=$6; bc+=$7}
              END {
                printf "## Cobertura de pruebas (backend)\n\n"
                printf "| Métrica | Cubierto |\n|---|---|\n"
                printf "| Líneas | %.1f%% (%d de %d) |\n", 100*lc/(lc+lm), lc, lc+lm
                if (bc+bm > 0) printf "| Ramas | %.1f%% (%d de %d) |\n", 100*bc/(bc+bm), bc, bc+bm
              }' "$CSV" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No se generó el reporte de JaCoCo." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Subir reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-cobertura
          path: backend/target/site/jacoco/
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint, pruebas y build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Correr pruebas
        run: npm test

      - name: Compilar
        run: npm run build
